name: TrialSniper Build

on:
  push:
    branches:
      - trial-sniper-build-20261031

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build TrialSniper
        working-directory: trial-sniper
        run: gradle build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TrialSniper-Fabric-26.2
          path: trial-sniper/build/libs/trial-sniper-0.1.0.jar
          if-no-files-found: error
